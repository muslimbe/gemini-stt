# Two services from one image, sharing the Gemini key, prompt and pipeline.
services:
  # Transcription MCP server for the tars bot. It joins tars's docker network,
  # so tars reaches it at http://stt:8080/mcp; no port is published.
  stt:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # tars's inbound attachments, read-only, at the same path as inside the
      # tars container (MEDIA_DIR), so marker paths work here verbatim.
      - ${TARS_ATTACHMENTS_DIR:-../tars/data/attachments}:/app/data/attachments:ro
    networks: [tars]

  # Standalone Telegram bot: send it a voice note, get a transcript back.
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["node", "src/bot.js"]
    volumes:
      - bot-data:/app/data

volumes:
  # The bot's allowlist (data/access.json).
  bot-data:

networks:
  tars:
    name: tars_default
    external: true
